<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0b">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Private multi-model reasoning workspace">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/app.css">
    <title>Mesh</title>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Mesh home">
          <span class="brand-mark" aria-hidden="true">
            <i></i><i></i><i></i>
          </span>
          <span>Mesh</span>
        </a>
        <span class="status"><i></i> Private session</span>
      </header>

      <main>
        <section class="intro" aria-labelledby="title">
          <p class="eyebrow">Hermes + Nemotron</p>
          <h1 id="title">Think through anything.</h1>
          <p>Multiple models explore the problem. One clear answer comes back.</p>
        </section>

        <section class="workspace" aria-label="Ask Mesh">
          <form id="ask-form">
            <label class="sr-only" for="prompt">What do you want to solve?</label>
            <textarea
              id="prompt"
              name="prompt"
              maxlength="12000"
              placeholder="What do you want to solve?"
              rows="5"
              required
            ></textarea>
            <div class="composer-bar">
              <button class="icon-button" id="record" type="button" aria-label="Record voice">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 15.5a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 1 0-7 0v6a3.5 3.5 0 0 0 3.5 3.5Z"/>
                  <path d="M5.5 11.5v.5a6.5 6.5 0 0 0 13 0v-.5M12 18.5V22M9 22h6"/>
                </svg>
              </button>
              <span class="record-label" id="record-label">Voice</span>
              <button class="submit-button" type="submit">
                <span>Run mesh</span>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m9 18 6-6-6-6"/>
                </svg>
              </button>
            </div>
          </form>
        </section>

        <section class="result" id="result" aria-live="polite" hidden>
          <div class="result-head">
            <span>Response</span>
            <div>
              <button class="text-button" id="listen" type="button">Listen</button>
              <button class="text-button" id="copy" type="button">Copy</button>
            </div>
          </div>
          <div id="answer"></div>
          <audio id="audio" controls hidden></audio>
        </section>

        <section class="loading" id="loading" aria-live="polite" hidden>
          <div class="pulse" aria-hidden="true"><i></i><i></i><i></i></div>
          <div>
            <strong>Working the problem</strong>
            <span id="loading-label">Exploring independent approaches...</span>
          </div>
        </section>
      </main>

      <footer>Models can make mistakes. Verify important results.</footer>
    </div>
    <div class="toast" id="toast" role="status" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
